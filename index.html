<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pioneirismo">
<meta name="theme-color" content="#f7f3ee">
<title>Pioneirismo</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f3ee;--card:#ffffff;--card2:#f0ebe4;
  --ink:#1c1814;--muted:#9a8f85;--border:#e5ddd5;
  --green:#2d6a4f;--green-l:#d8f3e3;--green-m:#52b788;
  --clay:#c9714a;--clay-l:#fbe8df;
  --gold:#b5853a;
  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{max-width:430px;margin:0 auto;padding-bottom:80px;min-height:100vh}
input:focus{outline:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}

.header{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;background:rgba(247,243,238,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{font-family:'Lora',serif;font-size:1.3rem;color:var(--green)}
.sync-row{display:flex;align-items:center;gap:5px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s;flex-shrink:0}
.sync-dot.ok{background:var(--green-m)}
.sync-dot.saving{background:var(--gold);animation:pulse .8s ease infinite}
.sync-dot.err{background:var(--clay)}
.sync-lbl{font-size:.7rem;color:var(--muted)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(247,243,238,.97);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px 8px;font-size:.65rem;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:500;transition:color .15s;-webkit-tap-highlight-color:transparent}
.nav-btn.active{color:var(--green)}
.nav-icon{font-size:1.1rem}

.page{display:none;padding:20px 16px}.page.active{display:block}

/* Progress */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-lbl{font-family:'Lora',serif;font-size:.82rem;color:var(--muted);margin-bottom:10px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.prog-val{font-family:'Lora',serif;font-size:1.5rem;color:var(--green)}
.prog-meta{font-size:.78rem;color:var(--muted)}
.prog-track{background:var(--card2);border-radius:99px;height:6px;overflow:hidden}
.prog-fill{height:100%;background:var(--green-m);border-radius:99px;transition:width .5s}
.prog-ends{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-top:4px}
.target-inp{font-size:.8rem;font-weight:600;color:var(--green);background:none;border:none;border-bottom:1px dashed var(--green);width:32px;text-align:center;font-family:'DM Sans',sans-serif;padding:0}

/* Week nav */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.arrow-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);width:36px;height:36px;font-size:1.1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);-webkit-tap-highlight-color:transparent;transition:background .15s}
.arrow-btn:hover{background:var(--green-l)}
.week-lbl{font-family:'Lora',serif;font-size:.8rem;color:var(--muted);text-align:center;flex:1}
.day-strip{display:flex;gap:5px;flex:1}
.day-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;min-width:0}
.day-btn.active{background:var(--green);border-color:var(--green)}
.day-btn.has-data{border-color:var(--green-m)}
.day-btn .dn{font-size:.58rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
.day-btn.active .dn{color:rgba(255,255,255,.75)}
.day-btn .dd{font-family:'Lora',serif;font-size:1rem;color:var(--ink)}
.day-btn.active .dd{color:white}
.day-btn .dh{font-size:.6rem;font-weight:600;color:var(--green-m);min-height:10px}
.day-btn.active .dh{color:rgba(255,255,255,.85)}

/* Day panel */
.day-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.dp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.dp-name{font-family:'Lora',serif;font-size:1rem;color:var(--ink)}
.badge-green{font-size:.75rem;font-weight:600;color:var(--green);background:var(--green-l);padding:3px 10px;border-radius:99px}
.badge-gray{font-size:.72rem;color:var(--muted);background:var(--card2);padding:3px 10px;border-radius:99px}

.acts-list{padding:6px 12px}
.act-item{display:flex;align-items:center;gap:9px;padding:9px 4px}
.act-item:not(:last-child){border-bottom:1px solid var(--border)}
.act-chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);background:white;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.act-chk.on{background:var(--green);border-color:var(--green)}
.act-chk.on::after{content:'✓';color:white;font-size:.68rem;font-weight:700}
.act-info{flex:1;min-width:0}
.act-name-inp{font-size:.88rem;font-weight:500;background:none;border:none;font-family:'DM Sans',sans-serif;color:var(--ink);width:100%;padding:0}
.act-name-inp:focus{border-bottom:1px dashed var(--green)}
.hrs-wrap{display:flex;align-items:center;gap:2px}
.hrs-inp{width:36px;text-align:right;font-size:.85rem;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:1px dashed transparent;font-family:'DM Sans',sans-serif;transition:all .15s}
.hrs-inp:focus{border-bottom-color:var(--green);color:var(--green)}
.hrs-sfx{font-size:.7rem;color:var(--muted)}
.del-btn{background:none;border:none;color:#ddd;font-size:1.1rem;cursor:pointer;padding:0 2px;line-height:1;-webkit-tap-highlight-color:transparent;transition:color .15s}
.del-btn:hover{color:var(--clay)}
.empty-day{padding:16px;text-align:center;color:var(--muted);font-size:.82rem}

.add-area{padding:10px 12px 14px;border-top:1px solid var(--border)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.preset{background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:5px 12px;font-size:.76rem;color:var(--muted);font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.preset:hover{border-color:var(--green);color:var(--green);background:var(--green-l)}
.add-row{display:flex;gap:7px;align-items:center}
.add-name{flex:1;font-size:.8rem;font-family:'DM Sans',sans-serif;border:1px dashed var(--border);border-radius:var(--rs);padding:7px 10px;background:white;color:var(--ink)}
.add-name:focus{border-color:var(--green)}
.add-hrs{width:56px;font-size:.8rem;font-family:'DM Sans',sans-serif;border:1px dashed var(--border);border-radius:var(--rs);padding:7px 8px;background:white;color:var(--ink);text-align:center}
.add-hrs:focus{border-color:var(--green)}
.add-btn{background:var(--green);color:white;border:none;border-radius:var(--rs);padding:7px 14px;font-size:.82rem;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}

.dp-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
.off-btn{font-size:.73rem;color:var(--muted);background:none;border:1px solid var(--border);border-radius:var(--rs);padding:4px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.off-btn.on{background:var(--clay-l);color:var(--clay);border-color:var(--clay)}

.week-sum{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ws-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ws-val{font-family:'Lora',serif;font-size:1.4rem;color:var(--green);line-height:1.1}
.ws-badge{font-size:.76rem;padding:5px 13px;border-radius:99px;font-weight:500}
.ws-badge.ok{background:var(--green-l);color:var(--green)}
.ws-badge.no{background:var(--clay-l);color:var(--clay)}

.btn-ghost{background:none;border:1px solid var(--border);border-radius:var(--rs);padding:8px 16px;font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--muted);cursor:pointer}
.btn-ghost:hover{border-color:var(--clay);color:var(--clay);background:var(--clay-l)}

/* History */
.hist-empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:.88rem;line-height:1.6}
.hist-week{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.hw-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hw-lbl{font-family:'Lora',serif;font-size:.92rem;color:var(--ink)}
.hw-hrs{font-size:.76rem;font-weight:600;color:var(--green);background:var(--green-l);padding:3px 10px;border-radius:99px}
.hw-body{display:none;border-top:1px solid var(--border);padding:12px 16px}
.hw-body.open{display:block}
.hw-day{margin-bottom:10px}
.hw-day:last-child{margin-bottom:0}
.hw-dname{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.hw-act{display:flex;align-items:center;gap:6px;font-size:.83rem;color:var(--ink);padding:2px 0}
.hw-dot{width:12px;height:12px;border-radius:4px;border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hw-dot.on{background:var(--green);border-color:var(--green)}
.hw-dot.on::after{content:'✓';color:white;font-size:.45rem;font-weight:700}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:99px;font-size:.78rem;font-weight:600;z-index:999;pointer-events:none;white-space:nowrap;opacity:0;background:var(--green);color:white}
.toast.show{animation:ta 2.5s ease forwards}
@keyframes ta{0%{opacity:0;transform:translateX(-50%) translateY(-6px)}15%,75%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0}}
</style>
</head>
<body>

<div class="header">
  <div class="brand">Pioneirismo</div>
  <div class="sync-row">
    <div class="sync-dot" id="syncDot"></div>
    <span class="sync-lbl" id="syncLbl">—</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="page active" id="pageHome">

  <!-- Progress -->
  <div class="card">
    <div class="card-lbl"><span id="monthLbl">—</span> · Meta: <input type="number" class="target-inp" id="targetInp" value="50" min="1" max="999">h</div>
    <div class="prog-row">
      <span class="prog-val" id="mTotal">0,0h</span>
      <span class="prog-meta"><span id="mRemain">50,0</span>h faltam</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-ends"><span>0h</span><span id="progMax">50h</span></div>
  </div>

  <!-- Week nav -->
  <div class="week-nav">
    <button class="arrow-btn" onclick="shiftWeek(-1)">‹</button>
    <div class="day-strip" id="dayStrip"></div>
    <button class="arrow-btn" onclick="shiftWeek(1)">›</button>
  </div>
  <div style="text-align:center;margin-top:-8px;margin-bottom:10px">
    <span class="week-lbl" id="weekLbl"></span>
  </div>

  <!-- Day panel -->
  <div class="day-panel" id="dayPanel">
    <div class="dp-head">
      <span class="dp-name" id="dpName">—</span>
      <span id="dpBadge"></span>
    </div>
    <div class="acts-list" id="actsList"></div>
    <div class="add-area" id="addArea">
      <div class="presets" id="presetsRow"></div>
      <div class="add-row">
        <input type="text" class="add-name" id="addNameInp" placeholder="Outra atividade…">
        <input type="number" class="add-hrs" id="addHrsInp" placeholder="2h" min="0.5" max="24" step="0.5">
        <button class="add-btn" onclick="addCustom()">+</button>
      </div>
    </div>
    <div class="dp-foot">
      <button class="off-btn" id="offBtn" onclick="toggleOff()">Marcar como dia livre</button>
    </div>
  </div>

  <!-- Week summary -->
  <div class="week-sum">
    <div><div class="ws-lbl">Esta semana</div><div class="ws-val" id="wTotal">0,0h</div></div>
    <span class="ws-badge no" id="wBadge">Abaixo da meta</span>
  </div>

  <div style="display:flex;justify-content:center">
    <button class="btn-ghost" onclick="clearDay()">Limpar dia</button>
  </div>
</div>

<div class="page" id="pageHistory">
  <div id="histContent"></div>
</div>

<nav class="nav">
  <button class="nav-btn active" id="navHome" onclick="showPage('home')"><span class="nav-icon">🌿</span><span>Semana</span></button>
  <button class="nav-btn" id="navHistory" onclick="showPage('history')"><span class="nav-icon">📋</span><span>Histórico</span></button>
</nav>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────────
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9VAQedPxB__jtz5_TaI5A8oI3piqMMraeP8iLvBNrp8JreFSR4391BYNPjREEZjpLyA/exec";

const PRESETS = [
  {key:"campo",    label:"Campo",    hrs:2},
  {key:"cartas",   label:"Cartas",   hrs:1.5},
  {key:"estudo",   label:"Estudo",   hrs:1},
  {key:"revisita", label:"Revisita", hrs:1},
  {key:"carrinho", label:"Carrinho", hrs:2},
  {key:"informal", label:"Informal", hrs:0.5},
];

// Day order: 0=Sun,1=Mon,...6=Sat — matches JS getDay()
const DAY_KEYS  = ["dom","seg","ter","qua","qui","sex","sab"];
const DAY_SHORT = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DAY_FULL  = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];

// ─── STATE ─────────────────────────────────────────────────────────────────────
// data.weeks = { "2026-05-11": { activities:[{id,key?,name,hrs,checked}], dayOff:bool }, ... }
// key is dateStr "YYYY-MM-DD"
let data = { weeks:{}, target:50 };
let selectedDate = todayStr();   // "YYYY-MM-DD"
let viewMonday   = getMonday(new Date()); // Date object — Monday of displayed week
let saveTimer    = null;

// ─── DATE HELPERS ──────────────────────────────────────────────────────────────
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function pad(n){ return String(n).padStart(2,"0"); }

function dateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

function getMonday(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  const day = date.getDay(); // 0=Sun
  const diff = day === 0 ? -6 : 1 - day; // go back to Monday
  date.setDate(date.getDate() + diff);
  return date;
}

function getWeekDays(monday){
  // Returns array of 7 Date objects Sun–Sat but displayed Mon–Sun
  // We want to show Mon, Tue, Wed, Thu, Fri, Sat, Sun
  return Array.from({length:7}, (_,i)=>{
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

function weekLabel(monday){
  const end = new Date(monday); end.setDate(monday.getDate()+6);
  const opts = {day:"2-digit",month:"short"};
  return monday.toLocaleDateString("pt-BR",opts)+" – "+end.toLocaleDateString("pt-BR",opts);
}

function fmt(h){ return (parseFloat(h)||0).toFixed(1).replace(".",","); }

// ─── DAY DATA ──────────────────────────────────────────────────────────────────
function ensureDay(ds){
  if(!data.weeks[ds]) data.weeks[ds] = {activities:[], dayOff:false};
  if(!data.weeks[ds].activities) data.weeks[ds].activities = [];
  return data.weeks[ds];
}

function dayHrs(ds){
  const d = data.weeks[ds];
  if(!d||d.dayOff) return 0;
  return (d.activities||[]).filter(a=>a.checked).reduce((s,a)=>s+(parseFloat(a.hrs)||0),0);
}

function weekHrs(monday){
  return getWeekDays(monday).reduce((s,d)=>s+dayHrs(dateStr(d)),0);
}

function monthHrs(){
  const now = new Date(), m=now.getMonth(), y=now.getFullYear();
  return Object.entries(data.weeks).reduce((s,[ds,d])=>{
    const date=new Date(ds+"T12:00");
    if(date.getMonth()!==m||date.getFullYear()!==y) return s;
    if(!d||d.dayOff) return s;
    return s+(d.activities||[]).filter(a=>a.checked).reduce((x,a)=>x+(parseFloat(a.hrs)||0),0);
  },0);
}

// ─── JSONP ─────────────────────────────────────────────────────────────────────
function jsonp(url, timeout=12000){
  return new Promise((resolve,reject)=>{
    const cb="_cb"+Date.now();
    let done=false;
    const t=setTimeout(()=>{if(!done){done=true;cleanup();reject(new Error("timeout"));}},timeout);
    window[cb]=d=>{if(!done){done=true;cleanup();resolve(d);}};
    const s=document.createElement("script");
    s.src=url+"&cb="+cb;
    s.onerror=()=>{if(!done){done=true;cleanup();reject(new Error("error"));}};
    function cleanup(){clearTimeout(t);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    document.head.appendChild(s);
  });
}

// ─── SYNC ──────────────────────────────────────────────────────────────────────
function setSync(state, lbl){
  document.getElementById("syncDot").className="sync-dot "+state;
  document.getElementById("syncLbl").textContent=lbl;
}

async function loadFromDrive(){
  setSync("saving","carregando…");
  try{
    const j=await jsonp(SCRIPT_URL+"?action=load&t="+Date.now());
    if(j&&j.status==="ok"&&j.data){
      data=j.data;
      if(!data.weeks) data.weeks={};
      if(!data.target) data.target=50;
      setSync("ok","Drive ✓");
      showToast("Dados carregados");
    } else {
      setSync("ok","Drive ✓");
    }
  }catch(e){
    setSync("err","offline");
    console.warn(e);
  }
  document.getElementById("targetInp").value=data.target;
  renderAll();
}

function scheduleSave(){
  setSync("saving","salvando…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      // Only send weeks that have any data
      const weeks={};
      Object.entries(data.weeks).forEach(([ds,d])=>{
        if(d&&(d.dayOff||d.activities?.length>0)) weeks[ds]=d;
      });
      const encoded=encodeURIComponent(JSON.stringify({weeks,target:data.target}));
      const j=await jsonp(SCRIPT_URL+"?action=save&d="+encoded+"&t="+Date.now(),15000);
      setSync(j&&j.status==="ok"?"ok":"err", j&&j.status==="ok"?"Drive ✓":"erro ao salvar");
    }catch(e){
      setSync("err","erro ao salvar");
      console.warn(e);
    }
  },1500);
}

// ─── RENDER ────────────────────────────────────────────────────────────────────
function renderAll(){
  renderProgress();
  renderStrip();
  renderDayPanel();
  renderWeekSum();
}

function renderProgress(){
  const now=new Date();
  document.getElementById("monthLbl").textContent=now.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}).replace(/^\w/,c=>c.toUpperCase());
  document.getElementById("targetInp").value=data.target;
  const mh=monthHrs(), rem=Math.max(0,data.target-mh), pct=Math.min(100,(mh/data.target)*100);
  document.getElementById("mTotal").textContent=fmt(mh)+"h";
  document.getElementById("mRemain").textContent=fmt(rem);
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("progMax").textContent=data.target+"h";
}

function renderStrip(){
  const days=getWeekDays(viewMonday);
  document.getElementById("weekLbl").textContent=weekLabel(viewMonday);
  const strip=document.getElementById("dayStrip");
  strip.innerHTML="";
  days.forEach(date=>{
    const ds=dateStr(date);
    const dh=dayHrs(ds);
    const isToday=ds===todayStr();
    const isSelected=ds===selectedDate;
    const d=data.weeks[ds];
    const hasData=d&&(d.dayOff||d.activities?.some(a=>a.checked));
    const dayIdx=date.getDay(); // 0=Sun

    const btn=document.createElement("div");
    btn.className="day-btn"+(isSelected?" active":hasData?" has-data":"");

    let dhHtml="&nbsp;";
    if(dh>0) dhHtml=fmt(dh)+"h";
    else if(isToday&&!isSelected) dhHtml="<span style='color:var(--clay)'>●</span>";

    btn.innerHTML=`<div class="dn">${DAY_SHORT[dayIdx]}</div><div class="dd">${date.getDate()}</div><div class="dh">${dhHtml}</div>`;
    btn.onclick=()=>{ selectedDate=ds; renderAll(); };
    strip.appendChild(btn);
  });
}

function renderDayPanel(){
  const d=ensureDay(selectedDate);
  const dh=dayHrs(selectedDate);
  const date=new Date(selectedDate+"T12:00");
  const dayIdx=date.getDay();
  const fullLabel=DAY_FULL[dayIdx]+", "+date.toLocaleDateString("pt-BR",{day:"2-digit",month:"long"});

  document.getElementById("dpName").textContent=fullLabel;

  const badge=document.getElementById("dpBadge");
  badge.innerHTML=d.dayOff
    ?`<span class="badge-gray">Dia livre</span>`
    :dh>0?`<span class="badge-green">${fmt(dh)}h`:``;

  const offBtn=document.getElementById("offBtn");
  offBtn.className="off-btn"+(d.dayOff?" on":"");
  offBtn.textContent=d.dayOff?"↩ Restaurar dia":"Marcar como dia livre";

  const list=document.getElementById("actsList");
  const addArea=document.getElementById("addArea");
  addArea.style.display=d.dayOff?"none":"block";

  if(d.dayOff){
    list.innerHTML=`<div class="empty-day">Dia livre 🌿</div>`;
  } else if(!d.activities.length){
    list.innerHTML=`<div class="empty-day">Adicione atividades abaixo</div>`;
  } else {
    list.innerHTML="";
    d.activities.forEach((act,idx)=>{
      const item=document.createElement("div"); item.className="act-item";

      const chk=document.createElement("div");
      chk.className="act-chk"+(act.checked?" on":"");
      chk.onclick=()=>{ d.activities[idx].checked=!act.checked; scheduleSave(); renderAll(); };

      const info=document.createElement("div"); info.className="act-info";
      const ni=document.createElement("input"); ni.type="text"; ni.className="act-name-inp"; ni.value=act.name;
      ni.onchange=e=>{ d.activities[idx].name=e.target.value; scheduleSave(); };
      info.appendChild(ni);

      const hw=document.createElement("div"); hw.className="hrs-wrap";
      const hi=document.createElement("input"); hi.type="number"; hi.className="hrs-inp"; hi.value=act.hrs; hi.min=0.5; hi.max=24; hi.step=0.5;
      hi.onchange=e=>{ const v=parseFloat(e.target.value); if(!isNaN(v)&&v>0){ d.activities[idx].hrs=v; scheduleSave(); renderAll(); } };
      const sfx=document.createElement("span"); sfx.className="hrs-sfx"; sfx.textContent="h";
      hw.appendChild(hi); hw.appendChild(sfx);

      const del=document.createElement("button"); del.className="del-btn"; del.textContent="×";
      del.onclick=()=>{ d.activities.splice(idx,1); scheduleSave(); renderAll(); };

      item.appendChild(chk); item.appendChild(info); item.appendChild(hw); item.appendChild(del);
      list.appendChild(item);
    });
  }

  document.getElementById("presetsRow").innerHTML=PRESETS.map(p=>
    `<button class="preset" onclick="addPreset('${p.key}','${p.label}',${p.hrs})">${p.label}</button>`
  ).join("");
}

function renderWeekSum(){
  const wh=weekHrs(viewMonday), tw=data.target/4;
  document.getElementById("wTotal").textContent=fmt(wh)+"h";
  const b=document.getElementById("wBadge");
  if(wh>=tw){ b.textContent="Na meta ✓"; b.className="ws-badge ok"; }
  else { b.textContent="Faltam "+fmt(tw-wh)+"h"; b.className="ws-badge no"; }
}

// ─── ACTIONS ───────────────────────────────────────────────────────────────────
function shiftWeek(dir){
  viewMonday=new Date(viewMonday);
  viewMonday.setDate(viewMonday.getDate()+dir*7);
  renderAll();
}

function addPreset(key, label, hrs){
  const d=ensureDay(selectedDate);
  if(d.activities.find(a=>a.key===key)){ showToast("Já adicionado!"); return; }
  d.activities.push({id:Date.now(),key,name:label,hrs,checked:false});
  scheduleSave(); renderAll();
}

function addCustom(){
  const name=document.getElementById("addNameInp").value.trim();
  const hrs=parseFloat(document.getElementById("addHrsInp").value);
  if(!name){ document.getElementById("addNameInp").focus(); return; }
  if(isNaN(hrs)||hrs<=0){ document.getElementById("addHrsInp").focus(); return; }
  const d=ensureDay(selectedDate);
  d.activities.push({id:Date.now(),name,hrs,checked:false});
  document.getElementById("addNameInp").value="";
  document.getElementById("addHrsInp").value="";
  scheduleSave(); renderAll();
}

function toggleOff(){
  const d=ensureDay(selectedDate);
  d.dayOff=!d.dayOff;
  if(d.dayOff) d.activities.forEach(a=>a.checked=false);
  scheduleSave(); renderAll();
}

function clearDay(){
  data.weeks[selectedDate]={activities:[],dayOff:false};
  scheduleSave(); renderAll();
}

// ─── HISTORY ───────────────────────────────────────────────────────────────────
function renderHistory(){
  const el=document.getElementById("histContent");
  // Group by week (Monday)
  const weekMap={};
  Object.entries(data.weeks).forEach(([ds,d])=>{
    if(!d||(! d.dayOff&&!d.activities?.length)) return;
    const mon=dateStr(getMonday(new Date(ds+"T12:00")));
    if(!weekMap[mon]) weekMap[mon]=[];
    weekMap[mon].push(ds);
  });

  const weeks=Object.keys(weekMap).sort((a,b)=>b.localeCompare(a));
  if(!weeks.length){
    el.innerHTML=`<div class="hist-empty">Nenhuma atividade registrada ainda.<br>Adicione atividades na aba Semana!</div>`;
    return;
  }

  el.innerHTML=weeks.map(mon=>{
    const monday=new Date(mon+"T12:00");
    const end=new Date(monday); end.setDate(monday.getDate()+6);
    const label=monday.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})+" – "+end.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
    const wh=weekHrs(monday);
    const days=weekMap[mon].sort();

    const daysHtml=days.map(ds=>{
      const d=data.weeks[ds];
      const date=new Date(ds+"T12:00");
      const dname=DAY_FULL[date.getDay()]+", "+date.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
      const acts=(d.activities||[]).map(a=>`
        <div class="hw-act">
          <div class="hw-dot${a.checked?" on":""}"></div>
          <span>${a.name} · ${fmt(a.hrs)}h</span>
        </div>`).join("");
      return `<div class="hw-day">
        <div class="hw-dname">${dname}${d.dayOff?" · Dia livre":""}</div>
        ${d.dayOff?"":acts}
      </div>`;
    }).join("");

    return `<div class="hist-week">
      <div class="hw-head" onclick="toggleHW('${mon}')">
        <div class="hw-lbl">${label}</div>
        ${wh>0?`<span class="hw-hrs">${fmt(wh)}h</span>`:""}
      </div>
      <div class="hw-body" id="hw_${mon}">${daysHtml}</div>
    </div>`;
  }).join("");
}

function toggleHW(mon){
  document.getElementById("hw_"+mon)?.classList.toggle("open");
}

// ─── UTILS ─────────────────────────────────────────────────────────────────────
function showPage(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("page"+name[0].toUpperCase()+name.slice(1)).classList.add("active");
  document.getElementById("nav"+name[0].toUpperCase()+name.slice(1))?.classList.add("active");
  if(name==="history") renderHistory();
  window.scrollTo(0,0);
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast"; void t.offsetWidth; t.className="toast show";
}

// ─── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById("targetInp").oninput=e=>{
  const v=parseInt(e.target.value); if(!isNaN(v)&&v>0){ data.target=v; scheduleSave(); renderAll(); }
};
document.getElementById("addNameInp").onkeydown=e=>{ if(e.key==="Enter") document.getElementById("addHrsInp").focus(); };
document.getElementById("addHrsInp").onkeydown=e=>{ if(e.key==="Enter") addCustom(); };

selectedDate=todayStr();
viewMonday=getMonday(new Date());
renderAll();
loadFromDrive();
</script>
</body>
</html>
